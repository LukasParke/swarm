services:
  runner:
    image: myoung34/github-runner:latest
    environment:
      RUNNER_NAME: swarm-deployer
      RUNNER_SCOPE: repo
      REPO_URL: https://github.com/LukasParke/swarm
      ACCESS_TOKEN: ${GITHUB_RUNNER_TOKEN}
      LABELS: swarm-deployer
      RUNNER_WORKDIR: /tmp/runner
      EPHEMERAL: "false"
      DISABLE_AUTO_UPDATE: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != Apollo
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first

networks:
  traefik_proxy:
    external: true
    name: traefik_traefik_proxy
