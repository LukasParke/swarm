services:
  flood:
    image: ghcr.io/hotio/rflood
    hostname: flood.internal
    cap_add:
      - NET_ADMIN
    environment:
      # App settings
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "Etc/UTC"
      LIBTORRENT: "v2"
      FLOOD_AUTH: "true"
      # VPN settings
      VPN_ENABLED: "true"
      VPN_CONF: "wg0"
      VPN_PROVIDER: "pia"
      VPN_LAN_NETWORK: "10.10.10.0/24"
      VPN_LAN_LEAK_ENABLED: "false"
      VPN_AUTO_PORT_FORWARD: "true"
      VPN_HEALTHCHECK_ENABLED: "false"
      VPN_PIA_PORT_FORWARD_PERSIST: "false"
      PRIVOXY_ENABLED: "false"
      UNBOUND_ENABLED: "false"
      # VPN credentials (substituted from GitHub Actions secrets during deploy)
      VPN_PIA_USER: ${VPN_PIA_USER}
      VPN_PIA_PASS: ${VPN_PIA_PASS}
      VPN_PIA_PREFERRED_REGION: ${VPN_PIA_PREFERRED_REGION}
    volumes:
      - flood-config:/config
      - flood-data:/data
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
        mode: ingress
      - target: 3000
        published: 3000
        protocol: tcp
        mode: ingress
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == Apollo
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      labels:
        - "homepage.name=flood"
        - "homepage.group=Media"
        - "homepage.icon=flood"
        - "homepage.href=https://flood.parke.dev"
        - "traefik.enable=true"
        # HTTPS router (Flood UI)
        - "traefik.http.routers.flood.rule=Host(`flood.parke.dev`)"
        - "traefik.http.routers.flood.entrypoints=websecure"
        - "traefik.http.routers.flood.tls=true"
        # HTTP router (redirect to HTTPS)
        - "traefik.http.routers.flood-http.rule=Host(`flood.parke.dev`)"
        - "traefik.http.routers.flood-http.entrypoints=web"
        - "traefik.http.routers.flood-http.middlewares=https-redirect@swarm"
        # Service port (Flood UI)
        - "traefik.http.services.flood.loadbalancer.server.port=3000"

volumes:
  flood-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/swarm-data/flood/config

  flood-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/user/swarm-data/flood/data

networks:
  traefik_proxy:
    external: true
    name: traefik_traefik_proxy
