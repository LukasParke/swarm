
services:
  init:
    image: alpine:latest
    command: >
      sh -c "
        mkdir -p /nfs/prowlarr/config &&
        echo 'Directories created successfully'
      "
    volumes:
      - nfs-root:/nfs
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr
    volumes:
      - prowlarr-config:/config
    networks:
      - traefik_proxy
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      labels:
        - "homepage.name=Prowlarr"
        - "homepage.group=Media"
        - "homepage.icon=prowlarr"
        - "homepage.href=https://prowlarr.parke.dev"
        - "traefik.enable=true"
        # HTTPS router (Flood UI)
        - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.parke.dev`)"
        - "traefik.http.routers.prowlarr.entrypoints=websecure"
        - "traefik.http.routers.prowlarr.tls=true"
        # HTTP router (redirect to HTTPS)
        - "traefik.http.routers.prowlarr-http.rule=Host(`prowlarr.parke.dev`)"
        - "traefik.http.routers.prowlarr-http.entrypoints=web"
        - "traefik.http.routers.prowlarr-http.middlewares=https-redirect@swarm"
        # Service port (Prowlarr UI)
        - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"


volumes:
  nfs-root:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=3,soft"
      device: ":/mnt/user/swarm-data"

  prowlarr-config:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=3,soft"
      device: ":/mnt/user/swarm-data/prowlarr/config"

networks:
  traefik_proxy:
    external: true
    name: traefik_traefik_proxy