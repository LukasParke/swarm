services:
  init:
    image: alpine:latest
    command: >
      sh -c "
        mkdir -p /nfs/npm/data/logs &&
        mkdir -p /nfs/npm/letsencrypt &&
        echo 'Directories created successfully'
      "
    volumes:
      - nfs-root:/nfs
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  app:
    image: jc21/nginx-proxy-manager:latest
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 81
        published: 81
        protocol: tcp
        mode: ingress
    volumes:
      - npm-data:/data
      - npm-letsencrypt:/etc/letsencrypt
    networks:
      - npm-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == zeus
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first

  stats:
    image: justsky/goaccess-for-nginxproxymanager:latest
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SKIP_ARCHIVED_LOGS: "${SKIP_ARCHIVED_LOGS}"
      BASIC_AUTH: "${BASIC_AUTH}"
      BASIC_AUTH_USERNAME: ${BASIC_AUTH_USERNAME}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD}
    ports:
      - target: 7880
        published: 7880
        protocol: tcp
        mode: ingress
    volumes:
      - npm-logs:/opt/log:ro
    networks:
      - npm-internal
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first

volumes:
  nfs-root:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=4,soft"
      device: ":/mnt/user/swarm-data"

  npm-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=4,soft"
      device: ":/mnt/user/swarm-data/npm/data"

  npm-letsencrypt:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=4,soft"
      device: ":/mnt/user/swarm-data/npm/letsencrypt"

  npm-logs:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,ro,nfsvers=4,soft"
      device: ":/mnt/user/swarm-data/npm/data/logs"

networks:
  npm-internal:
    driver: overlay
