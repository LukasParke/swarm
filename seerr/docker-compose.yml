services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    environment:
      - LOG_LEVEL=debug
      - TZ=America/Chicago
    volumes:
      - type: volume
        source: nfs-data
        target: /app/config
        volume:
          subpath: seerr/config
    networks:
      - traefik_proxy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname != Apollo
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
      labels:
        - "homepage.name=Seerr"
        - "homepage.group=Media"
        - "homepage.icon=overseerr"
        - "homepage.href=https://seerr.parke.dev"
        - "traefik.enable=true"
        # HTTPS router
        - "traefik.http.routers.seerr.rule=Host(`seerr.parke.dev`)"
        - "traefik.http.routers.seerr.entrypoints=websecure"
        - "traefik.http.routers.seerr.tls=true"
        # HTTP router (redirect to HTTPS)
        - "traefik.http.routers.seerr-http.rule=Host(`seerr.parke.dev`)"
        - "traefik.http.routers.seerr-http.entrypoints=web"
        - "traefik.http.routers.seerr-http.middlewares=https-redirect@swarm"
        # Service port
        - "traefik.http.services.seerr.loadbalancer.server.port=5055"

volumes:
  nfs-data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=10.10.10.215,rw,nfsvers=3,soft"
      device: ":/mnt/user/swarm-data"

networks:
  traefik_proxy:
    external: true
    name: traefik_traefik_proxy
